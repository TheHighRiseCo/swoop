<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Download with SWOOP</title><link rel="icon" href="icons/icon-32.png" type="image/png"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="prompt.css"></head>
<body><main>
  <header><img class="logo" src="assets/swoop.png" alt="SWOOP" width="72" height="72"><div><p class="eyebrow">SAVE WITH SWOOP</p><h1>Download this post?</h1></div></header>
  <p class="intro">All photos and videos, including the full carousel, username, and caption.</p>
  <p id="status" role="status" aria-live="polite">Reading the selected post…</p>
  <section id="post" hidden aria-label="Post preview">
    <div class="post-heading"><h2 id="username"></h2><span id="count" class="badge"></span></div>
    <a id="post-link" target="_blank" rel="noopener noreferrer">View on Instagram ↗</a>
    <p id="caption" class="caption"></p><ol id="media" class="media"></ol><p id="folder" class="folder"></p>
  </section>
  <div class="toolbar"><button id="save" class="primary" disabled>Download post</button><button id="cancel">Close</button><button id="scan">Read again</button></div>
  <div class="toolbar"><button id="add-bulk" disabled>Add to bulk queue</button><button id="open-bulk">Bulk downloads</button><button id="open-schedule" disabled>Schedule this post</button></div>
  <footer>Saves to your computer. Keep this window open until downloads finish.</footer>
</main><script type="module" src="dashboard.js"></script></body></html>
